name: ci

on:
  push:
  pull_request:

jobs:
  arm64-build-and-test:
    name: macOS ARM64 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: i8mm-auto
            arm_i8mm: "AUTO"
          - name: no-i8mm
            arm_i8mm: "OFF"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMOLLM_BUILD_TESTS=ON
          -DMOLLM_ARM_I8MM=${{ matrix.arm_i8mm }}
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test NEON runtime fallback
        if: matrix.arm_i8mm == 'AUTO'
        env:
          MOLLM_ARM_ISA: neon
        run: ctest --test-dir build --output-on-failure

  x86-build-and-test:
    name: Linux x86_64 (runtime ISA dispatch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify x86_64 runner
        run: test "$(uname -m)" = x86_64
      - name: Install E2E fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m pip install --disable-pip-version-check torch \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Verify E2E fixture dependencies
        run: python -c "import numpy, torch"
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMOLLM_BUILD_TESTS=ON
          -DMOLLM_BUILD_EXAMPLE=OFF
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test AVX2 ceiling
        env:
          MOLLM_X86_ISA: avx2
        run: ctest --test-dir build --output-on-failure
      - name: Test scalar fallback
        env:
          MOLLM_X86_ISA: scalar
        run: ctest --test-dir build --output-on-failure

  cuda-build:
    name: Linux x86_64 (CUDA 12.8, SM80 + SM120 compile)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: >
          apt-get update &&
          apt-get install -y --no-install-recommends
          cmake g++ git python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMOLLM_CUDA=ON
          -DMOLLM_BUILD_TESTS=ON
          -DMOLLM_BUILD_EXAMPLE=ON
          '-DCMAKE_CUDA_ARCHITECTURES=80;120'
      - name: Build
        run: cmake --build build -j 2
      - name: Host regression tests with CUDA enabled
        run: ctest --test-dir build --output-on-failure -LE cuda
      - name: CUDA tests without a device
        run: ctest --test-dir build --output-on-failure -L cuda

  linux-arm64-build-and-test:
    name: Linux ARM64 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: i8mm-auto
            arm_i8mm: "AUTO"
          - name: no-i8mm
            arm_i8mm: "OFF"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Install E2E fixture dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify E2E fixture dependency
        run: python -c "import numpy"
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMOLLM_BUILD_TESTS=ON
          -DMOLLM_BUILD_EXAMPLE=OFF
          -DMOLLM_ARM_I8MM=${{ matrix.arm_i8mm }}
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test NEON runtime fallback
        if: matrix.arm_i8mm == 'AUTO'
        env:
          MOLLM_ARM_ISA: neon
        run: ctest --test-dir build --output-on-failure
